<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>自駕特訓班：4個月玩轉日本</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&family=Klee+One:wght@400;600&family=Zen+Kurenaido&family=Yomogi&family=Hachi+Maru+Pop&family=Kaisei+HarunoUmi:wght@400;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a; --bg-card: #1a1a2e; --bg-card-hover: #22223a;
      --surface: #16213e; --accent: #e94560; --accent-glow: rgba(233,69,96,0.3);
      --gold: #f5c842; --gold-glow: rgba(245,200,66,0.25);
      --noun-green: #00e676; --particle-red: #ff5252; --verb-blue: #448aff;
      --text: #e8e8f0; --text-dim: #8888aa; --text-muted: #555577;
      --border: #2a2a4a; --success: #00e676; --warning: #ffab40;
      --radius: 16px; --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column;
      overflow-x: hidden; -webkit-user-select: none; user-select: none;
    }
    .hidden { display: none !important; }

    /* ═══ TOP BAR ═══ */
    .top-bar { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--bg-card); border-bottom:1px solid var(--border); z-index:100; flex-shrink:0; }
    .app-logo { font-size:1.1rem; font-weight:900; background:linear-gradient(135deg,var(--accent),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; }
    .top-spacer { flex:1; }
    .countdown-badge { font-size:0.72rem; font-weight:700; padding:4px 10px; border-radius:20px; background:var(--surface); color:var(--gold); border:1px solid rgba(245,200,66,0.3); white-space:nowrap; }
    .gear-btn { width:34px; height:34px; border:none; border-radius:50%; background:var(--surface); color:var(--text-dim); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    /* ═══ MONTH TABS ═══ */
    .month-nav { display:flex; gap:0; padding:8px 14px 0; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
    .month-nav::-webkit-scrollbar { display:none; }
    .month-tab { padding:8px 14px; border:none; font-family:inherit; font-size:0.75rem; font-weight:700; cursor:pointer; white-space:nowrap; background:transparent; color:var(--text-muted); border-bottom:2px solid transparent; transition:all 0.2s; }
    .month-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .month-tab.locked { opacity:0.4; cursor:default; }

    /* ═══ UNIT CARDS ═══ */
    .unit-scroll { display:flex; gap:8px; padding:10px 14px; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
    .unit-scroll::-webkit-scrollbar { display:none; }
    .unit-card { padding:8px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-family:inherit; font-size:0.75rem; font-weight:600; color:var(--text-dim); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all 0.2s; }
    .unit-card.active { background:var(--accent); color:white; border-color:var(--accent); box-shadow:0 0 16px var(--accent-glow); }

    /* ═══ PHASE TABS ═══ */
    .phase-nav { display:flex; gap:4px; padding:4px; margin:6px 14px 0; background:var(--surface); border-radius:14px; flex-shrink:0; }
    .phase-btn { flex:1; padding:8px 6px; border:none; border-radius:10px; font-family:inherit; font-size:0.72rem; font-weight:700; cursor:pointer; background:transparent; color:var(--text-muted); transition:all 0.2s; white-space:nowrap; }
    .phase-btn.active { background:var(--bg-card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,0.3); }

    /* ═══ PHASE CONTAINERS ═══ */
    .phase-container { flex:1; display:none; flex-direction:column; padding:12px 14px; overflow-y:auto; animation:fadeUp 0.25s ease; }
    .phase-container.active { display:flex; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ═══ PHASE 1 ═══ */
    .p1-topic { text-align:center; font-size:0.82rem; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
    .sentence-display { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:2px; font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif; font-size:clamp(2rem,9vw,3.5rem); font-weight:900; margin:16px 0; line-height:1.5; }
    .chunk-wrap { display:inline-flex; align-items:baseline; cursor:pointer; padding:2px 4px; border-radius:8px; transition:all 0.25s; position:relative; }
    .chunk-wrap:hover { background:rgba(255,255,255,0.05); }
    .chunk-wrap.active-chunk { transform:scale(1.12); background:rgba(255,255,255,0.08); }
    .chunk-char { display:inline-block; transition:color 0.3s,text-shadow 0.3s; color:var(--text-muted); }
    .chunk-char.lit { text-shadow:0 0 20px currentColor; }
    .color-noun-green { color:var(--noun-green) !important; }
    .color-particle-red { color:var(--particle-red) !important; }
    .color-verb-blue { color:var(--verb-blue) !important; }
    .p1-translation { text-align:center; font-size:1rem; color:var(--text-dim); margin-bottom:12px; font-weight:500; }
    .p1-controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
    .p1-play-btn { padding:12px 24px; border:none; border-radius:28px; font-family:inherit; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:6px; }
    .p1-play-btn:active { transform:scale(0.95); }
    .p1-play-btn.slow { background:var(--gold); color:#1a1a2e; box-shadow:0 4px 16px var(--gold-glow); }
    .p1-play-btn.normal { background:var(--surface); color:var(--text); border:1px solid var(--border); }
    .p1-note-area { background:var(--surface); border-radius:var(--radius); padding:12px 16px; margin-top:8px; border:1px solid var(--border); }
    .p1-note-text { font-size:0.82rem; color:var(--text-dim); line-height:1.7; text-align:center; }

    /* Furigana */
    .chunk-ruby { display:inline-flex; flex-direction:column; align-items:center; line-height:1; }
    .chunk-ruby .furigana { font-size:0.32em; font-weight:600; color:var(--text-dim); letter-spacing:1px; line-height:1; margin-bottom:2px; opacity:0.7; white-space:nowrap; }
    .chunk-ruby .furigana.lit { opacity:1; }

    /* ═══ PHASE 2 ═══ */
    .p2-scenario { background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; border:1px solid var(--border); text-align:center; }
    .p2-scenario-icon { font-size:2.5rem; margin-bottom:8px; }
    .p2-instruction { font-size:0.95rem; color:var(--text); line-height:1.7; font-weight:500; }
    .p2-hint-sentence { font-family:'M PLUS Rounded 1c','Noto Sans JP',sans-serif; font-size:1.6rem; font-weight:900; margin:16px 0; text-align:center; color:var(--text-dim); letter-spacing:2px; transition:color 0.5s; display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:2px; }
    .p2-hint-sentence.revealed { color:var(--text); }
    .p2-hint-sentence .chunk-ruby { display:inline-flex; flex-direction:column; align-items:center; line-height:1; }
    .p2-hint-sentence .furigana { font-size:0.38em; font-weight:600; color:var(--text-muted); letter-spacing:1px; line-height:1; margin-bottom:2px; opacity:0.7; white-space:nowrap; }
    .p2-hint-sentence.revealed .furigana { opacity:1; color:var(--text-dim); }
    .p2-hint-toggle { text-align:center; margin-bottom:16px; }
    .p2-hint-toggle button { padding:6px 16px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text-dim); font-family:inherit; font-size:0.75rem; font-weight:600; cursor:pointer; }
    .p2-mic-area { display:flex; flex-direction:column; align-items:center; gap:12px; }
    .mic-btn { width:72px; height:72px; border-radius:50%; border:3px solid var(--accent); background:var(--bg-card); color:var(--accent); font-size:1.8rem; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
    .mic-btn:active { transform:scale(0.9); }
    .mic-btn.listening { background:var(--accent); color:white; box-shadow:0 0 30px var(--accent-glow); animation:pulse-mic 1.2s infinite; }
    @keyframes pulse-mic { 0%,100%{box-shadow:0 0 20px var(--accent-glow)} 50%{box-shadow:0 0 40px var(--accent-glow)} }
    .p2-result { font-size:0.9rem; color:var(--text-dim); text-align:center; min-height:30px; line-height:1.5; }
    .p2-result.success { color:var(--success); font-weight:700; }
    .p2-result.fail { color:var(--particle-red); }
    .p2-keyword-chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
    .keyword-chip { padding:4px 12px; border-radius:14px; font-size:0.75rem; font-weight:600; background:var(--surface); color:var(--text-muted); border:1px solid var(--border); transition:all 0.3s; }
    .keyword-chip.matched { background:rgba(0,230,118,0.15); color:var(--success); border-color:rgba(0,230,118,0.4); }

    /* ═══ PHASE 3 ═══ */
    .p3-kanji-header { text-align:center; margin-bottom:8px; }
    .p3-kanji-emoji { font-size:2.5rem; }
    .p3-kanji-title { font-size:1.1rem; font-weight:700; color:var(--gold); margin-top:4px; }
    .p3-story-btn { padding:6px 16px; border:1px solid rgba(245,200,66,0.3); border-radius:20px; background:rgba(245,200,66,0.08); color:var(--gold); font-family:inherit; font-size:0.75rem; font-weight:600; cursor:pointer; margin-top:6px; }
    .p3-font-selector { display:flex; gap:4px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
    .p3-font-btn { padding:5px 10px; border:1px solid var(--border); border-radius:14px; font-family:inherit; font-size:0.68rem; font-weight:600; cursor:pointer; transition:all 0.15s; background:var(--surface); color:var(--text-dim); }
    .p3-font-btn.active { background:var(--gold); color:#1a1a2e; border-color:var(--gold); }
    .p3-audio-bar { display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
    .p3-audio-btn { padding:8px 16px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text); font-family:inherit; font-size:0.78rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all 0.15s; }
    .p3-audio-btn.playing { background:var(--accent); color:white; }
    .p3-canvas-area { display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:8px; }
    .p3-multi-canvas { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; width:100%; max-width:600px; margin:0 auto; }
    .p3-char-box { position:relative; background:#fafafa; border-radius:12px; border:2px solid var(--border); overflow:hidden; cursor:crosshair; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
    .p3-char-box canvas { position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; }
    .p3-char-box .hint-cv { z-index:1; opacity:0.25; pointer-events:none; }
    .p3-char-box .draw-cv { z-index:2; }
    .p3-char-box .guide-svg { position:absolute; inset:0; z-index:0; pointer-events:none; width:100%; height:100%; }
    .p3-char-box .char-label { position:absolute; bottom:3px; right:5px; z-index:3; font-size:0.55rem; color:var(--text-muted); pointer-events:none; font-weight:600; }
    .p3-char-box.done { border-color:var(--success); }
    .p3-char-box.checking { border-color:var(--warning); animation:pulse-border 0.8s infinite; }
    @keyframes pulse-border { 0%,100%{border-color:var(--warning)} 50%{border-color:var(--gold)} }
    .p3-controls { display:flex; gap:10px; justify-content:center; margin-top:10px; }
    .p3-ctrl-btn { padding:10px 22px; border:none; border-radius:24px; font-family:inherit; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:5px; }
    .p3-ctrl-btn:active { transform:scale(0.95); }
    .p3-ctrl-btn.clear { background:var(--surface); color:var(--warning); border:1px solid var(--border); }
    .p3-ctrl-btn.submit { background:var(--accent); color:white; box-shadow:0 4px 16px var(--accent-glow); }

    /* ═══ MODALS ═══ */
    .modal-overlay { display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-card); border-radius:24px; padding:24px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; border:1px solid var(--border); box-shadow:0 24px 80px rgba(0,0,0,0.5); animation:modalIn 0.3s ease; }
    @keyframes modalIn { from{opacity:0;transform:scale(0.92) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .modal h2 { font-size:1.15rem; margin-bottom:16px; color:var(--text); }
    .modal label { font-size:0.82rem; font-weight:600; color:var(--text-dim); display:block; margin-bottom:6px; }
    .modal input[type="password"],.modal input[type="text"],.modal input[type="date"] { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text); font-family:inherit; font-size:0.9rem; outline:none; }
    .modal input:focus { border-color:var(--accent); }
    .modal .hint-text { font-size:0.7rem; color:var(--text-muted); margin-top:4px; line-height:1.4; }
    .modal .section { margin-bottom:16px; }
    .modal-btns { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
    .modal-btn { padding:10px 22px; border:none; border-radius:18px; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; }
    .modal-btn.save { background:var(--accent); color:white; }
    .modal-btn.cancel { background:var(--surface); color:var(--text-dim); border:1px solid var(--border); }
    .story-modal { background:var(--bg-card); border-radius:28px; padding:28px; max-width:360px; width:100%; text-align:center; border:1px solid var(--border); box-shadow:0 24px 80px rgba(0,0,0,0.5); animation:modalIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275); }
    .story-emoji { font-size:3.5rem; margin-bottom:8px; }
    .story-title { font-size:1.2rem; font-weight:900; color:var(--gold); margin-bottom:12px; }
    .story-body { font-size:0.92rem; color:var(--text); line-height:1.8; padding:14px; background:var(--surface); border-radius:16px; margin-bottom:16px; text-align:left; }
    .story-close { padding:10px 28px; border:none; border-radius:24px; background:var(--gold); color:#1a1a2e; font-family:inherit; font-size:0.95rem; font-weight:700; cursor:pointer; }
    .story-listen { padding:10px 20px; border:none; border-radius:24px; background:var(--surface); color:var(--text); font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; margin-right:8px; border:1px solid var(--border); }

    /* Score / Toast */
    .score-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); background:var(--bg-card); padding:24px 36px; border-radius:24px; text-align:center; z-index:20000; border:2px solid var(--accent); box-shadow:0 16px 60px rgba(0,0,0,0.6); }
    .score-popup.show { animation:popScale 0.5s forwards; }
    @keyframes popScale { 0%{transform:translate(-50%,-50%) scale(0)} 80%{transform:translate(-50%,-50%) scale(1.08)} 100%{transform:translate(-50%,-50%) scale(1)} }
    .score-val { font-size:3rem; font-weight:900; display:block; }
    .score-desc { font-size:1.1rem; font-weight:600; color:var(--text-dim); display:block; margin-top:4px; }
    .score-popup.perfect { border-color:var(--gold); } .score-popup.perfect .score-val { color:var(--gold); }
    .score-popup.good .score-val { color:var(--success); }
    .score-popup.ok .score-val { color:var(--verb-blue); }
    .ocr-toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:20000; padding:12px 24px; background:var(--bg-card); border-radius:16px; border:1px solid var(--border); box-shadow:var(--shadow); text-align:center; animation:fadeUp 0.3s ease; }
    .ocr-toast .ocr-row { display:flex; align-items:center; gap:12px; font-size:1.1rem; }
    .ocr-toast .ocr-seen { font-size:2rem; font-weight:900; }
    .ocr-toast .ocr-ok { color:var(--success); } .ocr-toast .ocr-ng { color:var(--particle-red); }

    .no-key-banner { margin:8px 14px; padding:12px 16px; background:rgba(245,200,66,0.1); border:1px solid rgba(245,200,66,0.3); border-radius:12px; text-align:center; font-size:0.78rem; color:var(--gold); }
    .no-key-banner a { color:var(--accent); text-decoration:underline; cursor:pointer; }
    .bottom-bar { padding:8px 14px; background:var(--bg-card); border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .progress-bar { flex:1; height:6px; background:var(--surface); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width 0.5s ease; }
    .progress-label { font-size:0.72rem; font-weight:700; color:var(--text-dim); white-space:nowrap; }
    @media (max-width:400px) { .sentence-display { font-size:clamp(1.6rem,8vw,2.8rem); } }
  </style>
</head>
<body>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settings-modal"><div class="modal">
  <h2>⚙️ 設定</h2>
  <div class="section"><label>🧠 Gemini API Key（手寫辨識 + AI 功能）</label><input type="password" id="gemini-key-input" placeholder="AIza..."><div class="hint-text">免費申請：<a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent)">Google AI Studio</a></div></div>
  <div class="section"><label>🗓️ 出發日期</label><input type="date" id="trip-date-input"><div class="hint-text">設定你的日本自駕出發日，首頁會顯示倒數天數。</div></div>
  <div class="modal-btns"><button class="modal-btn cancel" onclick="closeSettings()">取消</button><button class="modal-btn save" onclick="saveSettings()">✅ 儲存</button></div>
</div></div>

<!-- STORY MODAL -->
<div class="modal-overlay" id="story-modal"><div class="story-modal">
  <div class="story-emoji" id="story-emoji">🛑</div>
  <div class="story-title" id="story-title"></div>
  <div class="story-body" id="story-body"></div>
  <button class="story-listen" onclick="readStory()">🔊 唸給我聽</button>
  <button class="story-close" onclick="closeStoryModal()">知道了！</button>
</div></div>

<!-- NOTE MODAL -->
<div class="modal-overlay" id="note-modal"><div class="story-modal" style="max-width:320px;">
  <div class="story-emoji" id="note-emoji"></div>
  <div class="story-title" id="note-title" style="font-size:1rem;"></div>
  <div class="story-body" id="note-body" style="text-align:center;"></div>
  <button class="story-close" onclick="document.getElementById('note-modal').classList.remove('open')">OK</button>
</div></div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="app-logo">🚗 自駕特訓班</div><div class="top-spacer"></div>
  <div class="countdown-badge" id="countdown-badge">🗓️ 設定出發日</div>
  <button class="gear-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="month-nav" id="month-nav"></div>
<div class="unit-scroll" id="unit-scroll"></div>

<div class="phase-nav">
  <button class="phase-btn active" onclick="switchPhase(1)">👀 拆解看聽</button>
  <button class="phase-btn" onclick="switchPhase(2)">🎤 情境開口</button>
  <button class="phase-btn" onclick="switchPhase(3)">✏️ 詞語手寫</button>
</div>

<div class="no-key-banner hidden" id="no-key-banner">🔑 尚未設定 Gemini API Key，手寫辨識功能無法使用。<a onclick="openSettings()">前往設定</a></div>

<!-- PHASE 1 -->
<div class="phase-container active" id="phase1">
  <div class="p1-topic" id="p1-topic"></div>
  <div class="sentence-display" id="p1-display"></div>
  <div class="p1-translation" id="p1-translation"></div>
  <div class="p1-controls">
    <button class="p1-play-btn slow" onclick="playPhase1('slow')">🔊 慢速播放</button>
    <button class="p1-play-btn normal" onclick="playPhase1('normal')">⚡ 常速播放</button>
  </div>
  <div class="p1-note-area" id="p1-note-area"></div>
</div>

<!-- PHASE 2 -->
<div class="phase-container" id="phase2">
  <div class="p2-scenario"><div class="p2-scenario-icon" id="p2-icon">🎭</div><div class="p2-instruction" id="p2-instruction"></div></div>
  <div class="p2-hint-sentence" id="p2-hint"></div>
  <div class="p2-hint-toggle"><button onclick="toggleHint()" id="hint-toggle-btn">👁️ 顯示提示</button></div>
  <div class="p2-mic-area">
    <button class="mic-btn" id="p2-mic-btn" onclick="startSpeechRecognition()">🎤</button>

};

// ══════════════════════════════════════════
// GLOBAL STATE
// ══════════════════════════════════════════
let GEMINI_KEY='', tripDate=null, currentMonth='month_1', currentUnitIdx=0, currentPhase=1, totalScore=0, hasWritten=false;
const synth=window.speechSynthesis; let jpVoice=null, zhVoice=null;

const HINT_FONTS = {
  klee:{name:'Klee One',label:'教科書',css:"'Klee One', cursive"},
  yuji:{name:'Yuji Syuku',label:'書道',css:"'Yuji Syuku', serif"},
  kaisei:{name:'Kaisei HarunoUmi',label:'毛筆',css:"'Kaisei HarunoUmi', serif"},
  hachi:{name:'Hachi Maru Pop',label:'可愛',css:"'Hachi Maru Pop', cursive"},
  zen:{name:'Zen Kurenaido',label:'手寫',css:"'Zen Kurenaido', cursive"},
  noto:{name:'Noto Sans JP',label:'印刷',css:"'Noto Sans JP', sans-serif"}
};
let currentHintFont='klee';

function findVoices(){const v=synth.getVoices();jpVoice=v.find(x=>x.lang==='ja-JP'&&x.name.includes('Google'))||v.find(x=>x.lang==='ja-JP')||null;zhVoice=v.find(x=>x.lang==='zh-TW'&&x.name.includes('Google'))||v.find(x=>x.lang.startsWith('zh'))||null;}
synth.addEventListener('voiceschanged',findVoices);findVoices();
function getCurrentUnits(){return CURRICULUM[currentMonth]?.units||[];}
function getCurrentUnit(){return getCurrentUnits()[currentUnitIdx]||null;}
function hasKanji(t){return/[\u4E00-\u9FFF\u3400-\u4DBF]/.test(t);}

// ══════════════════════════════════════════
// TTS
// ══════════════════════════════════════════
function speakJP(t,r=0.8){synth.cancel();return new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=r;if(jpVoice)u.voice=jpVoice;u.onend=res;u.onerror=res;synth.speak(u);})}
function speakZH(t){synth.cancel();return new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=0.9;if(zhVoice)u.voice=zhVoice;u.onend=res;u.onerror=res;synth.speak(u);})}

// ══════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════
function openSettings(){document.getElementById('settings-modal').classList.add('open');document.getElementById('gemini-key-input').value=GEMINI_KEY;document.getElementById('trip-date-input').value=tripDate||'';}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open');}
function saveSettings(){GEMINI_KEY=document.getElementById('gemini-key-input').value.trim();localStorage.setItem('jd-gemini-key',GEMINI_KEY);const d=document.getElementById('trip-date-input').value;if(d){tripDate=d;localStorage.setItem('jd-trip-date',d);}closeSettings();updateCountdown();updateNoKeyBanner();}
function updateCountdown(){const b=document.getElementById('countdown-badge');if(!tripDate){b.textContent='🗓️ 設定出發日';return;}const d=Math.ceil((new Date(tripDate)-new Date())/(1000*60*60*24));b.textContent=d>0?`🗓️ 出發倒數 ${d} 天`:d===0?'🎉 今天出發！':'✈️ 已在旅途中';}
function updateNoKeyBanner(){document.getElementById('no-key-banner').classList.toggle('hidden',!!GEMINI_KEY);}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function renderMonthTabs(){const n=document.getElementById('month-nav');n.innerHTML='';Object.entries(CURRICULUM).forEach(([k,m])=>{const b=document.createElement('button');b.className='month-tab'+(k===currentMonth?' active':'');if(!m.units.length&&k!==currentMonth)b.classList.add('locked');b.textContent=m.title;b.onclick=()=>{if(!m.units.length)return;currentMonth=k;currentUnitIdx=0;renderMonthTabs();renderUnitCards();loadUnit();};n.appendChild(b);});}
function renderUnitCards(){const s=document.getElementById('unit-scroll');s.innerHTML='';const u=getCurrentUnits();if(!u.length){s.innerHTML='<div style="padding:8px;color:var(--text-muted);font-size:0.8rem;">🔒 即將開放...</div>';return;}u.forEach((x,i)=>{const c=document.createElement('button');c.className='unit-card'+(i===currentUnitIdx?' active':'');c.textContent=x.topic;c.onclick=()=>{currentUnitIdx=i;renderUnitCards();loadUnit();};s.appendChild(c);});}
function switchPhase(n){currentPhase=n;document.querySelectorAll('.phase-container').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.phase-btn').forEach(e=>e.classList.remove('active'));document.getElementById('phase'+n).classList.add('active');document.querySelectorAll('.phase-btn')[n-1].classList.add('active');if(n===3)initCanvas();}
function loadUnit(){const u=getCurrentUnit();if(!u)return;buildPhase1(u);buildPhase2(u);buildPhase3(u);updateProgress();if(currentPhase===3)initCanvas();}

// ══════════════════════════════════════════
// PHASE 1: Look & Listen (with Furigana)
// ══════════════════════════════════════════
function buildPhase1(unit){
  document.getElementById('p1-topic').innerHTML='<span style="font-size:1.1rem;margin-right:4px;">📍</span>'+unit.topic;
  const c=document.getElementById('p1-display');c.innerHTML='';
  unit.chunks.forEach((chunk,ci)=>{
    const w=document.createElement('span');w.className='chunk-wrap';w.id='p1-c'+ci;
    const needsRuby=hasKanji(chunk.text)||(chunk.tts&&chunk.tts!==chunk.text);
    if(needsRuby){
      const rb=document.createElement('span');rb.className='chunk-ruby';
      const f=document.createElement('span');f.className='furigana';f.textContent=chunk.tts||'';rb.appendChild(f);
      const cl=document.createElement('span');cl.style.display='inline-flex';
      [...chunk.text].forEach(ch=>{const s=document.createElement('span');s.className='chunk-char';s.textContent=ch;const h=chunk.highlights.find(x=>x.target.includes(ch));if(h)s.dataset.css=h.cssClass;cl.appendChild(s);});
      rb.appendChild(cl);w.appendChild(rb);
    } else {
      [...chunk.text].forEach(ch=>{const s=document.createElement('span');s.className='chunk-char';s.textContent=ch;const h=chunk.highlights.find(x=>x.target.includes(ch));if(h)s.dataset.css=h.cssClass;w.appendChild(s);});
    }
    w.onclick=()=>showChunkNote(chunk);c.appendChild(w);
  });
  document.getElementById('p1-translation').textContent=unit.translation;
  const notes=unit.chunks.flatMap(x=>x.highlights.filter(h=>h.note).map(h=>h.note));
  document.getElementById('p1-note-area').innerHTML='<div class="p1-note-text">💡 '+(notes.length?notes.join('<br>'):'點擊任何區塊查看提示')+'</div>';
}
function showChunkNote(chunk){if(!chunk.highlights.length)return;const h=chunk.highlights[0],n=h.note||'';if(!n)return;document.getElementById('note-emoji').textContent=(n.match(/^[\p{Emoji}\u200d]+/u)||['💡'])[0];document.getElementById('note-title').textContent=chunk.text;document.getElementById('note-body').textContent=n;document.getElementById('note-modal').classList.add('open');speakJP(chunk.tts||chunk.text,0.7);}
async function playPhase1(speed){const u=getCurrentUnit();if(!u)return;const r=speed==='slow'?0.55:0.9;document.querySelectorAll('#p1-display .chunk-char').forEach(e=>{e.className='chunk-char';e.style.color='';});document.querySelectorAll('#p1-display .furigana').forEach(e=>e.classList.remove('lit'));for(let ci=0;ci<u.chunks.length;ci++){const ch=u.chunks[ci],w=document.getElementById('p1-c'+ci);w.classList.add('active-chunk');w.querySelectorAll('.chunk-char').forEach(e=>{const css=e.dataset.css;if(css)e.classList.add(css,'lit');else{e.classList.add('lit');e.style.color='var(--text)';}});w.querySelectorAll('.furigana').forEach(e=>e.classList.add('lit'));await speakJP(ch.tts||ch.text,r);w.classList.remove('active-chunk');}await new Promise(r=>setTimeout(r,300));await speakJP(u.fullTts||u.fullSentence,r+0.1);}

// ══════════════════════════════════════════
// PHASE 2: Roleplay (with Furigana hints)
// ══════════════════════════════════════════
let hintRevealed=false;
function buildPhase2(unit){
  document.getElementById('p2-icon').textContent=unit.kanjiTask?.emoji||'🎭';
  document.getElementById('p2-instruction').textContent=unit.roleplay.instruction;
  hintRevealed=false;
  const h=document.getElementById('p2-hint');h.innerHTML='';
  unit.chunks.forEach(chunk=>{
    const needsRuby=hasKanji(chunk.text)||(chunk.tts&&chunk.tts!==chunk.text);
    if(needsRuby){const rb=document.createElement('span');rb.className='chunk-ruby';rb.style.cssText='display:inline-flex;flex-direction:column;align-items:center;';const f=document.createElement('span');f.className='furigana';f.textContent=chunk.tts;rb.appendChild(f);const t=document.createElement('span');t.textContent=chunk.text;rb.appendChild(t);h.appendChild(rb);}
    else{const s=document.createElement('span');s.textContent=chunk.text;h.appendChild(s);}
  });
  h.classList.remove('revealed');h.style.filter='blur(8px)';
  document.getElementById('hint-toggle-btn').textContent='👁️ 顯示提示';
  document.getElementById('p2-result').textContent='按下麥克風，大聲說日文！';document.getElementById('p2-result').className='p2-result';
  const cc=document.getElementById('p2-chips');cc.innerHTML='';
  unit.roleplay.acceptKeywords.forEach(kw=>{const c=document.createElement('span');c.className='keyword-chip';c.textContent=kw;c.dataset.keyword=kw;cc.appendChild(c);});
}
function toggleHint(){hintRevealed=!hintRevealed;const h=document.getElementById('p2-hint');if(hintRevealed){h.classList.add('revealed');h.style.filter='none';document.getElementById('hint-toggle-btn').textContent='🙈 隱藏提示';}else{h.classList.remove('revealed');h.style.filter='blur(8px)';document.getElementById('hint-toggle-btn').textContent='👁️ 顯示提示';}}

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='ja-JP';recognition.interimResults=false;recognition.continuous=false;}
function startSpeechRecognition(){if(!recognition){document.getElementById('p2-result').textContent='瀏覽器不支援語音辨識，請用 Chrome。';return;}const u=getCurrentUnit();if(!u)return;const mb=document.getElementById('p2-mic-btn'),rd=document.getElementById('p2-result');mb.classList.add('listening');rd.textContent='聆聽中…大聲說出來！';rd.className='p2-result';recognition.start();recognition.onresult=e=>{mb.classList.remove('listening');const t=e.results[0][0].transcript;let mc=0;u.roleplay.acceptKeywords.forEach(kw=>{const c=document.querySelector('[data-keyword="'+kw+'"]');if(t.includes(kw)){mc++;if(c)c.classList.add('matched');}});if(mc>0){rd.innerHTML='🎉 太棒了！聽到了：「'+t+'」';rd.className='p2-result success';const h=document.getElementById('p2-hint');h.classList.add('revealed');h.style.filter='none';}else{rd.innerHTML='你說了：「'+t+'」🧐 再試試看！';rd.className='p2-result fail';}};recognition.onerror=()=>{mb.classList.remove('listening');rd.textContent='聽不清楚，請再試一次！';};recognition.onend=()=>mb.classList.remove('listening');}

// ══════════════════════════════════════════
// PHASE 3: Multi-Canvas Word Writing
// ══════════════════════════════════════════
let _p3BoxSize=150;

function buildPhase3(unit){
  if(!unit?.kanjiTask)return;
  const kt=unit.kanjiTask, chars=[...kt.target], n=chars.length;
  document.getElementById('p3-emoji').textContent=kt.emoji;
  document.getElementById('p3-title').textContent=kt.title;

  // Font selector
  const fs=document.getElementById('p3-font-selector');fs.innerHTML='';
  Object.entries(HINT_FONTS).forEach(([k,f])=>{const b=document.createElement('button');b.className='p3-font-btn'+(k===currentHintFont?' active':'');b.textContent='✍️ '+f.label;b.onclick=()=>{currentHintFont=k;buildPhase3(unit);initCanvas();};fs.appendChild(b);});

  // Audio buttons
  const ab=document.getElementById('p3-audio-bar');ab.innerHTML='';
  [{label:'🔊 聽整句',fn:()=>speakJP(unit.fullTts||unit.fullSentence,0.7)},{label:'🐢 慢速唸',fn:()=>speakJP(unit.fullTts||unit.fullSentence,0.4)},{label:'🇹🇼 中文翻譯',fn:()=>speakZH(unit.translation)}].forEach(x=>{const b=document.createElement('button');b.className='p3-audio-btn';b.textContent=x.label;b.onclick=()=>{b.classList.add('playing');x.fn().then(()=>b.classList.remove('playing'));};ab.appendChild(b);});

  // Multi-canvas
  const ca=document.getElementById('p3-canvas-area');ca.innerHTML='';
  const maxW=Math.min(window.innerWidth-40,560),gap=6;
  let bs;if(n<=2)bs=Math.min(180,(maxW-gap)/2);else if(n<=3)bs=Math.min(150,(maxW-gap*2)/3);else bs=Math.min(120,(maxW-gap*(n-1))/n);
  bs=Math.floor(bs);_p3BoxSize=bs;

  const mc=document.createElement('div');mc.className='p3-multi-canvas';
  chars.forEach((ch,i)=>{
    const box=document.createElement('div');box.className='p3-char-box';box.id='p3-box-'+i;box.style.cssText='width:'+bs+'px;height:'+bs+'px;';
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','guide-svg');svg.setAttribute('viewBox','0 0 '+bs+' '+bs);
    svg.innerHTML='<line x1="'+bs/2+'" y1="0" x2="'+bs/2+'" y2="'+bs+'" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,3"/><line x1="0" y1="'+bs/2+'" x2="'+bs+'" y2="'+bs/2+'" stroke="#ddd" stroke-width="0.5" stroke-dasharray="4,3"/>';
    box.appendChild(svg);
    const hc=document.createElement('canvas');hc.className='hint-cv';hc.id='p3-hint-'+i;box.appendChild(hc);
    const dc=document.createElement('canvas');dc.className='draw-cv';dc.id='p3-draw-'+i;box.appendChild(dc);
    const lb=document.createElement('span');lb.className='char-label';lb.textContent=(i+1)+'/'+n;box.appendChild(lb);
    mc.appendChild(box);
  });
  ca.appendChild(mc);
  const ctrl=document.createElement('div');ctrl.className='p3-controls';
  ctrl.innerHTML='<button class="p3-ctrl-btn clear" onclick="clearAllCanvases()">❌ 重寫</button><button class="p3-ctrl-btn submit" onclick="submitAllKanji()">⭕ 交卷</button>';
  ca.appendChild(ctrl);
}

async function initCanvas(){
  const u=getCurrentUnit();if(!u?.kanjiTask)return;
  const chars=[...u.kanjiTask.target],bs=_p3BoxSize,fi=HINT_FONTS[currentHintFont],fs=Math.floor(bs*0.72),fontSpec=fs+'px '+fi.css;
  try{await document.fonts.load(fontSpec,u.kanjiTask.target);}catch(e){}
  await document.fonts.ready;
  const ok=document.fonts.check(fontSpec,u.kanjiTask.target);
  const actualFont=ok?fontSpec:(fs+"px 'Noto Sans JP', sans-serif");
  chars.forEach((ch,i)=>{
    const hc=document.getElementById('p3-hint-'+i),dc=document.getElementById('p3-draw-'+i);if(!hc||!dc)return;
    hc.width=bs;hc.height=bs;dc.width=bs;dc.height=bs;
    const hctx=hc.getContext('2d');hctx.clearRect(0,0,bs,bs);hctx.font=actualFont;hctx.textAlign='center';hctx.textBaseline='middle';hctx.fillStyle='#ccc';hctx.fillText(ch,bs/2,bs/2);
    setupSingleCanvas(dc,bs);
  });
  hasWritten=false;
}

function setupSingleCanvas(cv,size){
  const clone=cv.cloneNode(true);cv.parentNode.replaceChild(clone,cv);
  const fc=document.getElementById(cv.id);fc.width=size;fc.height=size;
  const ctx=fc.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*0.022);ctx.strokeStyle='#333';
  let d=false;
  function gp(e){const r=fc.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-r.left)*(fc.width/r.width),y:(cy-r.top)*(fc.height/r.height)};}
  fc.addEventListener('mousedown',e=>{e.preventDefault();d=true;hasWritten=true;const p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  fc.addEventListener('mousemove',e=>{if(!d)return;e.preventDefault();const p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  fc.addEventListener('mouseup',()=>d=false);
  fc.addEventListener('touchstart',e=>{e.preventDefault();d=true;hasWritten=true;const p=gp(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  fc.addEventListener('touchmove',e=>{if(!d)return;e.preventDefault();const p=gp(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  fc.addEventListener('touchend',()=>d=false);
}

function clearAllCanvases(){const u=getCurrentUnit();if(!u?.kanjiTask)return;[...u.kanjiTask.target].forEach((c,i)=>{const cv=document.getElementById('p3-draw-'+i);if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);const bx=document.getElementById('p3-box-'+i);if(bx)bx.classList.remove('done','checking');});hasWritten=false;}

async function submitAllKanji(){
  if(!hasWritten){showPopup('請先寫字喔！✍️');return;}
  const u=getCurrentUnit();if(!u?.kanjiTask)return;
  const chars=[...u.kanjiTask.target];let ts=0;
  for(let i=0;i<chars.length;i++){
    const bx=document.getElementById('p3-box-'+i),cv=document.getElementById('p3-draw-'+i);if(!cv)continue;
    bx.classList.add('checking');
    if(GEMINI_KEY){
      try{const img=cv.toDataURL('image/png').split(',')[1];
        const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+GEMINI_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{inlineData:{mimeType:'image/png',data:img}},{text:'你是手寫日文辨識器。目標字：'+chars[i]+'\n只回傳 JSON：{"char":"你看到的字"}'}]}]})});
        const data=await res.json();const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||'';const p=JSON.parse(txt.replace(/```json|```/g,'').trim());const seen=p.char||'？';
        bx.classList.remove('checking');if(seen===chars[i]){bx.classList.add('done');ts+=12;}else{showOcrToast(seen,chars[i]);ts+=3;}
      }catch(e){bx.classList.remove('checking');ts+=6;}
    }else{bx.classList.remove('checking');bx.classList.add('done');ts+=6;}
  }
  const avg=Math.round(ts/chars.length),desc=avg>=12?'完美辨識！':avg>=8?'不錯！':'繼續練習',cls=avg>=12?'perfect':avg>=8?'good':'ok';
  totalScore+=avg;showScorePopup(avg,desc+' ('+u.kanjiTask.target+')',cls);updateProgress();
  setTimeout(()=>{document.querySelector('.score-popup')?.remove();const units=getCurrentUnits();if(currentUnitIdx<units.length-1){currentUnitIdx++;renderUnitCards();loadUnit();switchPhase(1);}else{clearAllCanvases();showPopup('🎉 全部完成！');}},2500);
}

// ══════════════════════════════════════════
function openStoryModal(){const u=getCurrentUnit();if(!u?.kanjiTask)return;const k=u.kanjiTask;document.getElementById('story-emoji').textContent=k.emoji;document.getElementById('story-title').textContent=k.title;document.getElementById('story-body').textContent=k.story;document.getElementById('story-modal').classList.add('open');}
function closeStoryModal(){document.getElementById('story-modal').classList.remove('open');}
function readStory(){const u=getCurrentUnit();if(u?.kanjiTask?.story)speakZH(u.kanjiTask.story);}
function updateProgress(){const u=getCurrentUnits(),t=u.length;document.getElementById('progress-label').textContent=(currentUnitIdx+1)+' / '+t;document.getElementById('progress-fill').style.width=(t>0?((currentUnitIdx+1)/t*100):0)+'%';document.getElementById('score-label').textContent=totalScore+' 分';}
function showScorePopup(p,d,c){document.querySelector('.score-popup')?.remove();const e=p>=12?'🎆':p>=10?'✨':p>=6?'👌':'💧',div=document.createElement('div');div.className='score-popup '+c+' show';div.innerHTML='<span class="score-val">+'+p+'</span><span class="score-desc">'+e+' '+d+'</span>';document.body.appendChild(div);}
function showOcrToast(s,x){const ok=s===x,t=document.createElement('div');t.className='ocr-toast';t.innerHTML='<div class="ocr-row"><span class="ocr-seen">'+s+'</span><span style="color:var(--text-muted)">→</span><span>'+x+'</span><span class="'+(ok?'ocr-ok':'ocr-ng')+'">'+(ok?'✅':'❌')+'</span></div>';document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function showPopup(m){const d=document.createElement('div');d.className='ocr-toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
